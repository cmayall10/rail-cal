name: Update fixture calendar
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: mkdir -p docs && python build_calendar.py
      - name: Commit if changed
        run: |
          git config user.name "fixture-bot"
          git config user.email "actions@github.com"
          git add docs/harrogate-railway.ics
          git diff --staged --quiet || git commit -m "Update fixtures $(date -u +%F)"
          git push
